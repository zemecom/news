parameters:
  paths:
    - ./app
    - ./src/Modules
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: /^Modules\\(?!Shared\\)[^\\]+\\Domain\\.*/
    - name: Application
      collectors:
        - type: classNameRegex
          value: /^Modules\\(?!Shared\\)[^\\]+\\Application\\.*/
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: /^Modules\\(?!Shared\\)[^\\]+\\Infrastructure\\.*/
    - name: Shared
      collectors:
        - type: classNameRegex
          value: /^Modules\\Shared\\.*/
    - name: Framework
      collectors:
        - type: classNameRegex
          value: /^App\\.*/
  ruleset:
    Domain:
      - Shared
    Application:
      - Domain
      - Shared
    Infrastructure:
      - Domain
      - Application
      - Shared
    Framework:
      - Domain
      - Application
      - Infrastructure
      - Shared
    Shared: ~
