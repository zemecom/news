version: '3.9'
services:
  app:
    build: ./docker
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
      - rabbitmq
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartnews
      POSTGRES_PASSWORD: smartnews
      POSTGRES_DB: smartnews
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
