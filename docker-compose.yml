services:
  app: &app_base
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-local}
      args: &app_build_args
        WITH_XDEBUG: ${WITH_XDEBUG:-1}
    volumes:
      - ./:/app
      - ./docker/.data/codex:/home/www-data/.codex
    environment:
      APP_URL: http://localhost:${APP_PORT:-8080}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-1}
      RR_RELOAD_ENABLED: ${RR_RELOAD_ENABLED:-0}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
      VITE_PORT: ${VITE_PORT:-5173}
      CODEX_HOME_BASE: ${CODEX_HOME_BASE:-/home/www-data/.codex/providers}
      PHP_IDE_CONFIG: "serverName=smartnews"
      HOME: /home/www-data
    ports:
      - "${APP_PORT:-8080}:8000"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  crawler-worker:
    <<: *app_base
    profiles: ["queue"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-local}
      args:
        <<: *app_build_args
        WITH_XDEBUG: ${WITH_XDEBUG_WORKER:-0}
    command: ["sh", "docker/bin/start-worker.sh"]
    environment:
      WORKER_RUNTIME_NAME: crawler-worker
      WORKER_QUEUES: crawler_tasks
    ports: []
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  intelligence-worker:
    <<: *app_base
    profiles: ["queue"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-local}
      args:
        <<: *app_build_args
        WITH_XDEBUG: ${WITH_XDEBUG_WORKER:-0}
    command: ["sh", "docker/bin/start-worker.sh"]
    environment:
      WORKER_RUNTIME_NAME: intelligence-worker
      WORKER_QUEUES: intelligence_tasks
    ports: []
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  media-worker:
    <<: *app_base
    profiles: ["queue"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-local}
      args:
        <<: *app_build_args
        WITH_XDEBUG: ${WITH_XDEBUG_WORKER:-0}
    command: ["sh", "docker/bin/start-worker.sh"]
    environment:
      WORKER_RUNTIME_NAME: media-worker
      WORKER_QUEUES: media_tasks
    ports: []
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker-control:
    <<: *app_base
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-local}
      args:
        <<: *app_build_args
        WITH_XDEBUG: 0
    command: ["php", "-S", "0.0.0.0:8081", "-t", "docker/worker-control/public", "docker/worker-control/router.php"]
    user: "0:0"
    volumes:
      - ./:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WORKER_SUPERVISOR_TOKEN: ${WORKER_SUPERVISOR_TOKEN:-local-worker-supervisor-token}
    ports: []
    depends_on: []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-smartnews}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartnews}
      POSTGRES_DB: ${DB_DATABASE:-smartnews}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./docker/.data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartnews"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - ./docker/.data/redis:/data
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartnews}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartnews}
    volumes:
      - ./docker/.data/rabbitmq:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_BIND:-127.0.0.1:5672}:5672"
      - "${RABBITMQ_MANAGEMENT_BIND:-127.0.0.1:15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./docker/.data/qdrant:/qdrant/storage
    ports:
      - "${QDRANT_BIND:-127.0.0.1:6333}:6333"
      - "${QDRANT_GRPC_BIND:-127.0.0.1:6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
