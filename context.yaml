$schema: 'https://raw.githubusercontent.com/context-hub/generator/refs/heads/main/json-schema.json'
documents:
  -
    description: 'Project Structure'
    outputPath: ../docs/PROJECT_STRUCTURE.md
    overwrite: true
    sources:
      -
        type: tree
        description: 'Directory Structure'
        sourcePaths:
          - app
          - src/Modules
        showTreeView: true
  -
    description: 'Project Interface'
    outputPath: ../docs/PROJECT_INTERFACE.md
    overwrite: true
    sources:
      -
        type: file
        description: 'Application Core'
        sourcePaths:
          - app
        filePattern: '*.php'
        showTreeView: false
        modifiers:
          -
            name: php-content-filter
            options:
              include_methods_pattern: '/.*/'
              include_properties_pattern: '/.*/'
              keep_method_bodies: false
              method_body_placeholder: ''
              keep_doc_comments: true
              keep_attributes: true
      -
        type: file
        description: 'Modules'
        sourcePaths:
          - src/Modules
        filePattern: '*.php'
        showTreeView: false
        modifiers:
          -
            name: php-content-filter
            options:
              include_methods_pattern: '/.*/'
              include_properties_pattern: '/.*/'
              keep_method_bodies: false
              method_body_placeholder: ''
              keep_doc_comments: true
              keep_attributes: true
